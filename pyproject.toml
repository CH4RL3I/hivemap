[project]
name = "hivemap"
version = "0.1.0"
description = "Aerial crowd analysis from drone video: detection, multi-object tracking, density maps and ground-plane analytics, evaluated on VisDrone-MOT."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Emilio Gappa" }]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python-headless>=4.9",
  "pillow>=10",
  "matplotlib>=3.8",
  "torch>=2.2",
  "torchvision>=0.17",
  "transformers>=4.40",
  "typer>=0.12",
  "gdown>=5",
]

[project.scripts]
hivemap = "hivemap.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hivemap"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
